<!doctype html>
<!--
  Pagina di lancio di AV Assistant, pubblicata su GitHub Pages
  (https://av-assistant.github.io/). L'app vera e' nel repo
  francesco-brisacane/av-assistant, deployata su Streamlit Cloud.

  E' il link d'ingresso da condividere: mostra il bottone "Apri" verso l'app.
  L'installazione sul telefono NON si fa da qui ma dall'app stessa, dove un
  banner "Installa AV Assistant" compare solo quando manifest e icone AV sono
  pronti (vedi lib/pwa.py dell'app). Installando l'app vera si apre a schermo
  intero, senza la barra che Chrome mostra quando un'app installata da qui
  apre un altro dominio.

  Per questo la pagina non dichiara un manifest (Chrome non propone di
  installarla). Il redirect per display-mode standalone / ?pwa=1 resta per chi
  l'aveva gia' installata dalla versione precedente.
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AV Assistant</title>
  <meta name="description" content="Assistente Anonymous for the Voiceless">

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#000000">

  <script>
    var APP_URL = "https://av-assistant-jahevfahcjvxnt7sz5nnwk.streamlit.app/";

    // Installazioni della versione precedente: aperta dalla Home -> redirect
    // immediato, prima del render della landing.
    (function () {
      var params = new URLSearchParams(location.search);
      var launchedFromHome =
        params.has("pwa") ||
        window.navigator.standalone === true ||  // iOS
        window.matchMedia("(display-mode: standalone)").matches;
      if (!launchedFromHome) return;
      params.delete("pwa");
      var qs = params.toString();
      location.replace(APP_URL + (qs ? "?" + qs : "") + location.hash);
      document.documentElement.className = "launching";
    })();
  </script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { width: 100%; max-width: 380px; }
    .logo { width: 128px; height: 128px; border-radius: 28px; display: block; margin: 0 auto 20px; }
    h1 { font-size: 26px; margin: 0 0 6px; font-weight: 700; }
    .sub { color: #aaa; margin: 0 0 28px; font-size: 15px; }
    .btn {
      display: block; width: 100%;
      padding: 14px 18px; margin-bottom: 12px;
      border-radius: 12px; border: 1px solid #fff;
      background: #fff; color: #000;
      font-size: 16px; font-weight: 600; text-decoration: none;
    }
    .howto {
      margin-top: 20px; padding: 16px; border-radius: 12px;
      background: #111; color: #ccc; font-size: 14px; line-height: 1.5; text-align: left;
    }
    .howto strong { color: #fff; }
    /* Durante il redirect mostriamo solo il logo, niente landing. */
    .launching .landing { display: none; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icon-512.png" alt="">
    <div class="landing">
      <h1>AV Assistant</h1>
      <p class="sub" data-i18n="sub"></p>
      <a class="btn" id="open" data-i18n="open"></a>
      <div class="howto" id="howto"></div>
    </div>
  </main>

  <script>
    var STRINGS = {
      IT: {
        sub: "Assistente Anonymous for the Voiceless",
        open: "Apri l'assistente",
        howto: "<strong>Vuoi averla sulla schermata Home?</strong> Apri l'assistente: appena è pronto compare in alto il riquadro <strong>Installa AV Assistant</strong>. Installala da lì."
      },
      EN: {
        sub: "Anonymous for the Voiceless assistant",
        open: "Open the assistant",
        howto: "<strong>Want it on your Home Screen?</strong> Open the assistant: as soon as it is ready, an <strong>Install AV Assistant</strong> box appears at the top. Install it from there."
      }
    };

    var params = new URLSearchParams(location.search);
    var lang = (params.get("lang") || "").toUpperCase();
    if (!STRINGS[lang]) lang = /^it\b/i.test(navigator.language || "") ? "IT" : "EN";
    var t = STRINGS[lang];
    document.documentElement.lang = lang.toLowerCase();

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t[el.getAttribute("data-i18n")];
    });
    document.getElementById("howto").innerHTML = t.howto;

    // Passiamo la lingua all'app, cosi' anche il banner di installazione e'
    // nella lingua giusta.
    params.set("lang", lang);
    document.getElementById("open").href = APP_URL + "?" + params.toString();
  </script>
</body>
</html>
